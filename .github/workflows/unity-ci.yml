name: Unity CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: Ignorer le cache Unity pour diagnostiquer un problème d'import
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  checks: write

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: .
  UNITY_VERSION: auto
  UNITY_STREAM: "6000.5"
  TARGET_PLATFORM: StandaloneWindows64

jobs:
  tests:
    name: Tests Edit Mode et Play Mode
    # Temporairement désactivé tant que le projet ne contient pas de vrais tests Unity.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version et la licence Unity
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ "$project_version" != "$UNITY_STREAM".* ]]; then
            echo "::error title=Version Unity incorrect::Le projet utilise $project_version au lieu de la branche Unity $UNITY_STREAM."
            exit 1
          fi

          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error title=Secrets Unity manquants::Ajoutez UNITY_EMAIL et UNITY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "::error title=Licence Unity Personal manquante::Ajoutez le contenu complet du fichier de licence dans le secret GitHub UNITY_LICENSE."
            exit 1
          fi

      - name: Restaurer le cache Unity incrémental
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-tests-
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - name: Exécuter les tests Unity
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: artifacts/tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Edit Mode et Play Mode - résultats

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unity
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Windows 64 bits
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version et la licence Unity
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ "$project_version" != "$UNITY_STREAM".* ]]; then
            echo "::error title=Version Unity incorrect::Le projet utilise $project_version au lieu de la branche Unity $UNITY_STREAM."
            exit 1
          fi

          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error title=Secrets Unity manquants::Ajoutez UNITY_EMAIL et UNITY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "::error title=Licence Unity Personal manquante::Ajoutez le contenu complet du fichier de licence dans le secret GitHub UNITY_LICENSE."
            exit 1
          fi

      - name: Libérer de l'espace disque pour Unity
        shell: bash
        run: |
          echo "Espace disponible avant le nettoyage :"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          docker system prune --all --force

          echo "Espace disponible après le nettoyage :"
          df -h /

      - name: Restaurer le dernier cache Unity réussi de la branche
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ env.TARGET_PLATFORM }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ env.TARGET_PLATFORM }}-

      - name: Compiler le jeu
        id: unity-build-windows
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildsPath: build
          buildName: FarmJam2026
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'Semantic' }}

      - name: Vérifier la version du build Windows
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.unity-build-windows.outputs.buildVersion }}
        run: |
          if [[ -z "$BUILD_VERSION" ]]; then
            echo "::error title=Version Unity absente::GameCI n'a retourné aucune version pour le build Windows."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            if [[ "$BUILD_VERSION" != "$expected_version" ]]; then
              echo "::error title=Version de release incorrecte::Le tag demande $expected_version mais Unity a produit $BUILD_VERSION."
              exit 1
            fi
          fi

          echo "### Version du build Windows : \`$BUILD_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Sauvegarder le cache après un build réussi sur main ou dev
        if: ${{ success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev') }}
        uses: actions/cache/save@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ env.TARGET_PLATFORM }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Supprimer les anciens caches de main ou dev
        if: ${{ success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ env.TARGET_PLATFORM }}-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_PREFIX: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ env.TARGET_PLATFORM }}-
        run: |
          stale_cache_ids="$(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --key "$CACHE_PREFIX" \
              --limit 100 \
              --json id,key \
              --jq ".[] | select(.key != \"$CACHE_KEY\") | .id"
          )"

          if [[ -z "$stale_cache_ids" ]]; then
            echo "Aucun ancien cache à supprimer pour $GITHUB_REF."
            exit 0
          fi

          while read -r cache_id; do
            echo "Suppression de l'ancien cache $cache_id pour $GITHUB_REF."
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done <<< "$stale_cache_ids"

      - name: Publier le build et ses fichiers de diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ github.sha }}
          path: |
            build
            Library/LastBuild.buildreport
          if-no-files-found: warn
          retention-days: 14

  build_webgl:
    name: Build WebGL pour itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version et la licence Unity
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          project_version="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          if [[ "$project_version" != "$UNITY_STREAM".* ]]; then
            echo "::error title=Version Unity incorrect::Le projet utilise $project_version au lieu de la branche Unity $UNITY_STREAM."
            exit 1
          fi

          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error title=Secrets Unity manquants::Ajoutez UNITY_EMAIL et UNITY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "::error title=Licence Unity Personal manquante::Ajoutez le contenu complet du fichier de licence dans le secret GitHub UNITY_LICENSE."
            exit 1
          fi

      - name: Libérer de l'espace disque pour Unity
        shell: bash
        run: |
          echo "Espace disponible avant le nettoyage :"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          docker system prune --all --force

          echo "Espace disponible après le nettoyage :"
          df -h /

      - name: Restaurer le dernier cache Unity WebGL réussi de la branche
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.clean_cache }}
        uses: actions/cache/restore@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-WebGL-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-WebGL-

      - name: Compiler le jeu en WebGL
        id: unity-build-webgl
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildsPath: build
          buildName: FarmJam2026
          versioning: ${{ startsWith(github.ref, 'refs/tags/') && 'Tag' || 'Semantic' }}

      - name: Vérifier la version du build WebGL
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.unity-build-webgl.outputs.buildVersion }}
        run: |
          if [[ -z "$BUILD_VERSION" ]]; then
            echo "::error title=Version Unity absente::GameCI n'a retourné aucune version pour le build WebGL."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            if [[ "$BUILD_VERSION" != "$expected_version" ]]; then
              echo "::error title=Version de release incorrecte::Le tag demande $expected_version mais Unity a produit $BUILD_VERSION."
              exit 1
            fi
          fi

          echo "### Version du build WebGL : \`$BUILD_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Préparer l'archive itch.io
        shell: bash
        run: |
          webgl_directory="build/WebGL/FarmJam2026"
          archive_path="$GITHUB_WORKSPACE/artifacts/FarmJam2026-WebGL.zip"

          if [[ ! -f "$webgl_directory/index.html" ]]; then
            echo "::error title=Build WebGL incomplet::Le fichier $webgl_directory/index.html est introuvable."
            exit 1
          fi

          mkdir -p "$(dirname "$archive_path")"
          (
            cd "$webgl_directory"
            zip -q -r "$archive_path" .
          )

          echo "Archive itch.io créée : $archive_path"
          unzip -l "$archive_path" | sed -n '1,20p'

      - name: Sauvegarder le cache après un build WebGL réussi sur main ou dev
        if: ${{ success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev') }}
        uses: actions/cache/save@v6
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-WebGL-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Supprimer les anciens caches WebGL de main ou dev
        if: ${{ success() && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/dev') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-WebGL-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_PREFIX: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-WebGL-
        run: |
          stale_cache_ids="$(
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --key "$CACHE_PREFIX" \
              --limit 100 \
              --json id,key \
              --jq ".[] | select(.key != \"$CACHE_KEY\") | .id"
          )"

          if [[ -z "$stale_cache_ids" ]]; then
            echo "Aucun ancien cache WebGL à supprimer pour $GITHUB_REF."
            exit 0
          fi

          while read -r cache_id; do
            echo "Suppression de l'ancien cache WebGL $cache_id pour $GITHUB_REF."
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done <<< "$stale_cache_ids"

      - name: Publier le build WebGL pour itch.io
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-webgl-itch-${{ github.sha }}
          path: |
            artifacts/FarmJam2026-WebGL.zip
            Library/LastBuild.buildreport
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Rapport CI
    if: ${{ always() && !cancelled() }}
    needs:
      - tests
      - build
      - build_webgl
    runs-on: ubuntu-latest

    steps:
      - name: Résumer la compilation et les tests
        shell: bash
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.build.result }}
          WEBGL_BUILD_RESULT: ${{ needs.build_webgl.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result_icon() {
            if [[ "$1" == "success" ]]; then
              printf 'Réussi'
            elif [[ "$1" == "cancelled" ]]; then
              printf 'Annulé'
            elif [[ "$1" == "skipped" ]]; then
              printf 'Ignoré'
            else
              printf 'Échec'
            fi
          }

          {
            echo "# Rapport Unity CI"
            echo
            echo "Unity : branche \`$UNITY_STREAM\` — commit : \`${GITHUB_SHA:0:7}\`"
            echo
            echo "| Contrôle | Résultat |"
            echo "| --- | --- |"
            echo "| Tests Edit Mode et Play Mode (temporairement désactivés) | $(result_icon "$TEST_RESULT") |"
            echo "| Compilation Windows 64 bits | $(result_icon "$WINDOWS_BUILD_RESULT") |"
            echo "| Compilation WebGL pour itch.io | $(result_icon "$WEBGL_BUILD_RESULT") |"
            echo
            echo "## Si quelque chose casse"
            echo
            echo "- Pour un test : ouvrez le check **Unity Edit Mode et Play Mode - résultats**. Le nom du test, son message d'erreur et sa stack trace indiquent la cause. Les XML et logs complets sont aussi dans l'artefact \`rapport-tests-unity\`."
            echo "- Pour la compilation : ouvrez le job Windows ou WebGL concerné et cherchez la première ligne \`error CS…\`, \`Exception\` ou \`BuildFailedException\`. C'est généralement la cause initiale ; les erreurs suivantes peuvent n'être que des conséquences."
            echo "- Pour itch.io : téléchargez l'artefact \`build-webgl-itch-...\`, puis importez directement le fichier \`FarmJam2026-WebGL.zip\` comme projet HTML5."
            echo "- Si le log contient \`manifest unknown\` ou \`no matching manifest\`, l'image GameCI de cette version Unity très récente n'est pas encore disponible : c'est un problème d'infrastructure CI, pas une régression du jeu."
            echo "- Pour la licence ou la version Unity : le workflow produit une annotation GitHub explicite avant de lancer Unity."
            echo
            echo "[Ouvrir tous les logs de cette exécution]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ( "$TEST_RESULT" != "success" && "$TEST_RESULT" != "skipped" ) || "$WINDOWS_BUILD_RESULT" != "success" || "$WEBGL_BUILD_RESULT" != "success" ]]; then
            echo "::error title=Compilation Unity en échec::Au moins une compilation Unity a échoué. Consultez le rapport résumé et le premier message d'erreur dans les logs."
            exit 1
          fi

  sign_windows_release:
    name: Signer le build Windows de release
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' }}
    needs:
      - build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Vérifier que le tag appartient à main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider l'origine du tag
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Le tag $env:GITHUB_REF_NAME pointe vers un commit qui n'appartient pas à la branche main."
          }

      - name: Télécharger le build Windows
        uses: actions/download-artifact@v4
        with:
          name: build-windows-${{ github.sha }}
          path: artifacts

      - name: Signer et vérifier FarmJam2026.exe
        shell: pwsh
        env:
          CODESIGN_PWD: ${{ secrets.CERTIFICATE_PASSWORD }}
          CODESIGN_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PWD) -or [string]::IsNullOrWhiteSpace($env:CODESIGN_BASE64)) {
            throw "Les secrets CERTIFICATE_PASSWORD et CERTIFICATE_BASE64 sont requis pour signer la release."
          }

          $certificateDirectory = Join-Path $env:RUNNER_TEMP "FarmJam2026-CodeSigning"
          $base64Path = Join-Path $certificateDirectory "FarmJam2026-CodeSigning.txt"
          $pfxPath = Join-Path $certificateDirectory "FarmJam2026-CodeSigning.pfx"
          $cerPath = Join-Path $certificateDirectory "FarmJam2026-CodeSigning.cer"
          $certificate = $null

          try {
            New-Item -ItemType Directory -Path $certificateDirectory -Force | Out-Null
            Set-Content -LiteralPath $base64Path -Value $env:CODESIGN_BASE64 -Encoding ascii
            certutil -decode $base64Path $pfxPath | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Impossible de reconstruire le certificat PFX depuis CERTIFICATE_BASE64."
            }

            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              throw "signtool.exe est introuvable sur le runner."
            }
            Write-Host "Utilisation de signtool : $signtool"

            $targets = @(Get-ChildItem -Path artifacts -Filter "FarmJam2026.exe" -File -Recurse)
            if ($targets.Count -ne 1) {
              throw "Un unique FarmJam2026.exe était attendu, trouvé : $($targets.Count)."
            }

            foreach ($target in $targets) {
              & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.sectigo.com/rfc3161" `
                /f $pfxPath /p $env:CODESIGN_PWD $target.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "La signature Authenticode de $($target.FullName) a échoué."
              }
            }

            $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $pfxPath,
              $env:CODESIGN_PWD
            )
            [IO.File]::WriteAllBytes(
              $cerPath,
              $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )

            certutil -addstore -f Root $cerPath
            if ($LASTEXITCODE -ne 0) {
              throw "Impossible d'ajouter temporairement le certificat au magasin Root."
            }
            certutil -addstore -f TrustedPublisher $cerPath
            if ($LASTEXITCODE -ne 0) {
              throw "Impossible d'ajouter temporairement le certificat au magasin TrustedPublisher."
            }

            foreach ($target in $targets) {
              Write-Host "Vérification de $($target.FullName)"
              $signature = Get-AuthenticodeSignature $target.FullName
              $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "La vérification Authenticode de $($target.FullName) a échoué : $($signature.StatusMessage)"
              }
            }
          }
          finally {
            if ($null -ne $certificate) {
              certutil -delstore Root $certificate.Thumbprint | Out-Null
              certutil -delstore TrustedPublisher $certificate.Thumbprint | Out-Null
              $certificate.Dispose()
            }
            Remove-Item -LiteralPath $certificateDirectory -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Publier le build Windows signé
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-signed-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  draft_release:
    name: Préparer la release brouillon
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.sign_windows_release.result == 'success' && needs.build_webgl.result == 'success' }}
    needs:
      - build_webgl
      - sign_windows_release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Récupérer le dépôt et l'historique Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag appartient à main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag hors de main::Le tag $GITHUB_REF_NAME pointe vers un commit qui n'appartient pas à la branche main."
            exit 1
          fi

      - name: Télécharger le build Windows
        uses: actions/download-artifact@v4
        with:
          name: build-windows-signed-${{ github.sha }}
          path: release-assets/windows

      - name: Télécharger le build WebGL
        uses: actions/download-artifact@v4
        with:
          name: build-webgl-itch-${{ github.sha }}
          path: release-assets/webgl

      - name: Préparer les archives de la release
        id: release-assets
        shell: bash
        run: |
          safe_tag="${GITHUB_REF_NAME//\//-}"
          windows_executable="$(find release-assets/windows -type f -name 'FarmJam2026.exe' -print -quit)"
          webgl_source="$(find release-assets/webgl -type f -name 'FarmJam2026-WebGL.zip' -print -quit)"

          if [[ -z "$windows_executable" ]]; then
            echo "::error title=Build Windows incomplet::FarmJam2026.exe est introuvable dans l'artefact Windows."
            exit 1
          fi

          if [[ -z "$webgl_source" ]]; then
            echo "::error title=Build WebGL incomplet::FarmJam2026-WebGL.zip est introuvable dans l'artefact WebGL."
            exit 1
          fi

          windows_directory="$(dirname "$windows_executable")"
          windows_archive="$GITHUB_WORKSPACE/FarmJam2026-Windows-x64-$safe_tag.zip"
          webgl_archive="$GITHUB_WORKSPACE/FarmJam2026-WebGL-$safe_tag.zip"

          (
            cd "$windows_directory"
            zip -q -r "$windows_archive" .
          )
          cp "$webgl_source" "$webgl_archive"

          (
            cd "$GITHUB_WORKSPACE"
            sha256sum "$(basename "$windows_archive")" "$(basename "$webgl_archive")" > SHA256SUMS.txt
          )
          checksum_file="$GITHUB_WORKSPACE/SHA256SUMS.txt"

          echo "windows_archive=$windows_archive" >> "$GITHUB_OUTPUT"
          echo "webgl_archive=$webgl_archive" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Attester la provenance des archives
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.release-assets.outputs.checksum_file }}

      - name: Créer ou actualiser la release brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ARCHIVE: ${{ steps.release-assets.outputs.windows_archive }}
          WEBGL_ARCHIVE: ${{ steps.release-assets.outputs.webgl_archive }}
          CHECKSUM_FILE: ${{ steps.release-assets.outputs.checksum_file }}
        run: |
          existing_release="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' \
              2>/dev/null || true
          )"

          if [[ -n "$existing_release" ]]; then
            if [[ "$existing_release" != "true" ]]; then
              echo "::error title=Release déjà publiée::La release $GITHUB_REF_NAME existe déjà et n'est plus un brouillon."
              exit 1
            fi

            gh release upload "$GITHUB_REF_NAME" \
              "$WINDOWS_ARCHIVE#Windows x64" \
              "$WEBGL_ARCHIVE#WebGL pour itch.io" \
              "$CHECKSUM_FILE#Empreintes SHA-256" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$WINDOWS_ARCHIVE#Windows x64" \
            "$WEBGL_ARCHIVE#WebGL pour itch.io" \
            "$CHECKSUM_FILE#Empreintes SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --draft \
            --generate-notes \
            --fail-on-no-commits \
            --notes "Builds Windows x64 et WebGL validés automatiquement par Unity CI."
